name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uth-calendar
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  notify:
    name: Telegram notification
    runs-on: ubuntu-latest

    needs:
      - publish-image

    if: always()

    steps:
      - name: Notify CD result
        env:
          BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CI_TELEGRAM_CHAT_ID }}
          PUBLISH_RESULT: ${{ needs.publish-image.result }}

        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_SHORT="${GITHUB_SHA::7}"
          DOCKER_URL="https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/uth-calendar"

          if [ "$PUBLISH_RESULT" = "success" ]; then

            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=📦 CD PUBLISH SUCCESS

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${COMMIT_SHORT}

          Docker tags:
          latest
          sha-${COMMIT_SHORT}

          Image:
          ${{ secrets.DOCKERHUB_USERNAME }}/uth-calendar" \
              --data-urlencode "reply_markup={
                \"inline_keyboard\": [
                  [
                    {
                      \"text\": \"🐳 View Docker Hub\",
                      \"url\": \"${DOCKER_URL}\"
                    }
                  ],
                  [
                    {
                      \"text\": \"📋 View CD Run\",
                      \"url\": \"${RUN_URL}\"
                    }
                  ]
                ]
              }"

          else

            curl -sS \
              -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=💥 CD PUBLISH FAILED

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${COMMIT_SHORT}

          Publish result: ${PUBLISH_RESULT}" \
              --data-urlencode "reply_markup={
                \"inline_keyboard\": [
                  [
                    {
                      \"text\": \"🔴 View Failed CD Run\",
                      \"url\": \"${RUN_URL}\"
                    }
                  ]
                ]
              }"

          fi